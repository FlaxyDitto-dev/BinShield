name: Unified Cross-Platform Release Builds (Windows, Linux, macOS, Android)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: .\build.bat
      - run: .\dist\OpcodeShield-CLI.exe --version
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/OpcodeShield-GUI.exe dist/OpcodeShield-CLI.exe --clobber

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update && sudo apt-get install -y python3-tk
          chmod +x build_linux.sh
          ./build_linux.sh
          ./dist/OpcodeShield-CLI-Linux --version
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/OpcodeShield-GUI-Linux dist/OpcodeShield-CLI-Linux --clobber

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          chmod +x build_macos.sh
          ./build_macos.sh
          cd dist && zip -r OpcodeShield-GUI-macOS.zip OpcodeShield-GUI-macOS.app || true
          ./OpcodeShield-CLI-macOS --version
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/OpcodeShield-CLI-macOS dist/OpcodeShield-GUI-macOS.zip --clobber

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "OpcodeShield-Android-${{ github.ref_name }}.apk"
          gh release upload "${{ github.ref_name }}" "OpcodeShield-Android-${{ github.ref_name }}.apk" --clobber
